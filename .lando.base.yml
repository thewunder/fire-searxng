name: hermes

services:
  redis:
    api: 3
    type: lando
    app_mount: false
    services:
      image: docker.io/valkey/valkey:8-alpine
      command: valkey-server --save 30 1 --loglevel warning
      volumes:
        - valkey-data2:/data

  searxng:
    api: 3
    type: lando
    ssl: true
    sslExpose: false
    scanner: false
    app_mount: false
    services:
      image: docker.io/searxng/searxng:latest
      command: /usr/local/searxng/entrypoint.sh 
      volumes:
        - ./searxng:/etc/searxng
        - searxng-data:/var/cache/searxng
      environment:
        SEARXNG_BASE_URL: https://search.lndo.site/

  llama-cpp:
    api: 3
    type: lando
    scanner: false
    app_mount: false
    ssl: false
    services:
      image: ghcr.io/ggml-org/llama.cpp:server-cuda
      command: >
        /app/llama-server
        --model /models/Qwen3.6/Qwen3.6-27B-UD-Q4_K_XL.gguf
        --mmproj /models/Qwen3.6/mmproj-BF16.gguf
        --gpu-layers all
        --ctx-size 262144
        --port 5090
        --temp 0.7
        --top-p 0.95
        --top-k 20
        --min-p 0.0
        --presence-penalty 1.5
        --flash-attn on 
        --cache-type-k q8_0 
        --cache-type-v q8_0 
        --alias qwen3.6-27b-unsloth
        --no-mmap
      volumes:
        - /srv/shared/clawdbot/gguf:/models
      environment:
        LLAMA_CACHE: unsloth/qwen3.6-27b-gguf

      devices:
        - /dev/kfd:/dev/kfd
        - /dev/dri:/dev/dri
      ports:
        - "5090:5090"

proxy:
  searxng:
    - search.lndo.site:8080
