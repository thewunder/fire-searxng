name: searxng-openwebui

services:
  redis:
    api: 3
    type: lando
    app_mount: false
    services:
      image: docker.io/valkey/valkey:8-alpine
      command: valkey-server --save 30 1 --loglevel warning
      volumes:
        - valkey-data2:/data

  searxng:
    api: 3
    type: lando
    ssl: true
    sslExpose: false
    scanner: false
    app_mount: false
    services:
      image: docker.io/searxng/searxng:latest
      command: /usr/local/searxng/entrypoint.sh 
      volumes:
        - ./searxng:/etc/searxng
        - searxng-data:/var/cache/searxng
      environment:
        SEARXNG_BASE_URL: https://search.lndo.site/

  open-webui:
    api: 3
    type: lando
    scanner: false
    app_mount: false
    ssl: true
    sslExpose: false
    services:
      image: ghcr.io/open-webui/open-webui:main
      command: bash start.sh
      volumes:
        - open-webui-data:/app/backend/data
      environment:
        WEBUI_AUTH: false
        OLLAMA_BASE_URL: http://ollama:11434

  ollama:
    api: 3
    type: lando
    scanner: false
    app_mount: false
    ssl: false
    services:
      image: ollama/ollama:rocm
      command: /bin/ollama serve
      volumes:
        - /usr/share/ollama/.ollama:/root/.ollama
      environment:
        OLLAMA_HOST: "0.0.0.0:11434"
        #HSA_OVERRIDE_GFX_VERSION: "11.0.0"
        OLLAMA_VULKAN: 1

      devices:
        - /dev/kfd:/dev/kfd
        - /dev/dri:/dev/dri
      ports:
        - "11434:11434"

proxy:
  searxng:
    - search.lndo.site:8080
  open-webui:
    - open-webui.lndo.site:8080

tooling:
  ollama:
    service: ollama
    description: Run ollama CLI commands
    cmd: ollama
