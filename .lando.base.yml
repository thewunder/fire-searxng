name: searxng-openwebui

services:
  redis:
    api: 3
    type: lando
    app_mount: false
    services:
      image: docker.io/valkey/valkey:8-alpine
      command: valkey-server --save 30 1 --loglevel warning
      volumes:
        - valkey-data2:/data

  searxng:
    api: 3
    type: lando
    ssl: true
    sslExpose: false
    scanner: false
    app_mount: false
    services:
      image: docker.io/searxng/searxng:latest
      command: /usr/local/searxng/entrypoint.sh 
      volumes:
        - ./searxng:/etc/searxng
        - searxng-data:/var/cache/searxng
      environment:
        SEARXNG_BASE_URL: https://search.lndo.site/

  open-webui:
    api: 3
    type: lando
    scanner: false
    app_mount: false
    ssl: true
    sslExpose: false
    services:
      image: ghcr.io/open-webui/open-webui:main
      command: bash start.sh
      volumes:
        - open-webui-data:/app/backend/data
      environment:
        WEBUI_AUTH: false
        OLLAMA_BASE_URL: http://ollama:11434

  llama-cpp:
    api: 3
    type: lando
    scanner: false
    app_mount: false
    ssl: false
    services:
      # User -rocm if you have an AMD GPU
      image: ghcr.io/ggml-org/llama.cpp:server-vulkan
      command: /app/llama-server -m gemma-4-31B-it-Q4_K_M.gguf --n-gpu-layers -1
      volumes:
        - /usr/share/gguf:/models
      environment:
        LLAMA_CACHE: unsloth/gemma-4-31B-A4B-it-GGUF

      devices:
        - /dev/kfd:/dev/kfd
        - /dev/dri:/dev/dri
      ports:
        - "8080:8080"

proxy:
  searxng:
    - search.lndo.site:8080
  open-webui:
    - open-webui.lndo.site:8080

